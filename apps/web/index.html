<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Unfold Research</title>
    <script>
      // Apply the persisted colour mode before first paint to avoid a flash.
      try {
        const mode =
          JSON.parse(localStorage.getItem("unfoldresearch:preferences") ?? "{}")
            .state?.colorMode ?? "system";
        const dark =
          mode === "dark" ||
          (mode === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
